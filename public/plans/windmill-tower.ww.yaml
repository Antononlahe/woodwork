steps:
  - id: cut-base
    title: "Cut the base"
    body: "Cut a 140mm square from 12mm vineer. Drill three 8mm holes, 8mm deep: one in the exact middle for the tower pin, two out near the corners for the trees."
    show: [base]
    highlight: [base.pin, base.tree-a, base.tree-b]

  - id: cut-drums
    title: "Cut nine drums"
    body: "Cut nine 12mm disks with a jigsaw. They shrink by 3mm each: 84, 81, 78, 75, 72, 69, 66, 63, 60. Sand the edges round. Drill an 8mm hole right through the widest one, and an 8mm pocket 4mm deep in the underside of the smallest, a little toward the front."
    show: [drum-0, drum-1, drum-2, drum-3, drum-4, drum-5, drum-6, drum-7, drum-8]
    highlight: [drum-0.pin, drum-8.pin]

  - id: stack-tower
    title: "Stack the tower"
    body: "Glue the 8mm pin in the middle hole of the base. Slide the widest drum on it, then the rest in order, glue between each. Keep the sides lined up. Let it set before moving on."
    show: [base, pin-bottom, drum-0, drum-1, drum-2, drum-3, drum-4, drum-5, drum-6, drum-7, drum-8]
    join:
      - from: pin-bottom
        into: base.pin

  - id: door
    title: "Door and step"
    body: "Cut a 30 by 40mm door frame from 4mm vineer with a 14mm wide arched opening, and a 30 by 14mm step from 4mm vineer. Glue the frame on the front of the tower and the step in front of it. Fill small gaps with glue."
    show: [base, pin-bottom, drum-0, drum-1, drum-2, drum-3, drum-4, drum-5, drum-6, drum-7, drum-8, door, doorstep]

  - id: windows
    title: "Two windows"
    body: "Cut two small rings from 4mm vineer, 16mm across with an 8mm hole. Glue one on the front of the tower about halfway up, the other near the top."
    show: [base, pin-bottom, drum-0, drum-1, drum-2, drum-3, drum-4, drum-5, drum-6, drum-7, drum-8, door, doorstep, window-a, window-b]

  - id: cut-head
    title: "Cut the cap"
    body: "Cut a 32 by 24 by 28mm block. Drill an 8mm pocket 10mm deep in the bottom. Then drill an 8mm hole right through the sides, near the top, for the shaft."
    show: [head]
    highlight: [head.pocket, head.shaft]

  - id: seat-head
    title: "Seat the cap"
    body: "Glue the short pin in the pocket of the top drum. Press the cap on it. The shaft hole should run front to back."
    show: [base, pin-bottom, drum-0, drum-1, drum-2, drum-3, drum-4, drum-5, drum-6, drum-7, drum-8, pin-top, head, door, doorstep, window-a, window-b]
    join:
      - from: pin-top
        into: head.pocket

  - id: roof
    title: "Mitre the roof"
    body: "Mitre a 40 by 30mm roof with a 14mm high ridge running front to back. Glue it on top of the cap, a little over the edges."
    show: [base, pin-bottom, drum-0, drum-1, drum-2, drum-3, drum-4, drum-5, drum-6, drum-7, drum-8, pin-top, head, door, doorstep, window-a, window-b, roof]

  - id: cut-sails
    title: "Cut the sails"
    body: "Cut a 32mm hub and an 18mm nose from 12mm vineer. Drill an 8mm hole through the middle of each. Cut two sail arms from 4mm vineer, 94 by 16mm, and drill an 8mm hole through the middle of each."
    show: [hub, nose, arm-h, arm-v]
    highlight: [hub.bore, nose.bore, arm-h.bore, arm-v.bore]

  - id: glue-sails
    title: "Glue the sails"
    body: "Glue the flat arm on the front of the hub. Glue the upright arm over it, so the two make a plus. Line up all the holes with the hub hole."
    show: [hub, arm-h, arm-v]

  - id: fit-shaft
    title: "Fit the shaft"
    body: "Slide the 8mm shaft through the nose, both arms and the hub, then the cap. Glue the nose and the hub to the shaft. Sand the cap hole until the sails turn. The sails must not touch the tower."
    show: [base, pin-bottom, drum-0, drum-1, drum-2, drum-3, drum-4, drum-5, drum-6, drum-7, drum-8, pin-top, head, roof, door, doorstep, window-a, window-b, shaft, hub, nose, arm-h, arm-v]
    join:
      - from: shaft
        into: head.shaft
      - from: shaft
        into: hub.bore
      - from: shaft
        into: nose.bore

  - id: trees
    title: "Plant two trees"
    body: "For each tree: glue an 8mm trunk in the base, then press a cone with an 8mm pocket on top. Make each cone from four 12mm disks, shaped with a rasp, or ask a grown-up to turn one."
    show: [base, trunk-a, tree-a, trunk-b, tree-b]
    join:
      - from: trunk-a
        into: base.tree-a
      - from: trunk-a
        into: tree-a.trunk
      - from: trunk-b
        into: base.tree-b
      - from: trunk-b
        into: tree-b.trunk

  - id: spin-check
    title: "Check the spin"
    body: "Blow on the sails. They should turn without touching the tower or the cap. If they catch, sand the shaft hole a little. Compare it to the finished picture in the corner."
    show: [base, pin-bottom, drum-0, drum-1, drum-2, drum-3, drum-4, drum-5, drum-6, drum-7, drum-8, door, doorstep, window-a, window-b, pin-top, head, roof, shaft, hub, nose, arm-h, arm-v, trunk-a, tree-a, trunk-b, tree-b]

  - id: paint
    title: "Paint it (optional)"
    body: "Sand every edge soft. Paint the base green, the tower cream with a grey foot, the roof brown and the cones green. Sails white, hub yellow, nose red. Keep paint off the shaft so it still turns."
    show: [base, pin-bottom, drum-0, drum-1, drum-2, drum-3, drum-4, drum-5, drum-6, drum-7, drum-8, door, doorstep, window-a, window-b, pin-top, head, roof, shaft, hub, nose, arm-h, arm-v, trunk-a, tree-a, trunk-b, tree-b]
    paint: true
    adult: false
