format: woodwork/v0
id: tabletop-windmill
title: Tabletop windmill
summary: A small windmill that actually spins.
difficulty: easy
time_minutes: 60
finished_size: { x: 160, y: 160, z: 180 }

parts:
  - id: base
    kind: box
    size: { x: 80, y: 80, z: 12 }
    holes:
      - id: mast-socket
        diameter: 8
        depth: 8
        at: { x: 40, y: 40, z: 12 }
        dir: -z

  - id: mast
    kind: dowel
    diameter: 8
    length: 140

  - id: head
    kind: box
    size: { x: 30, y: 22, z: 22 }
    holes:
      - id: mast-pocket
        diameter: 8
        depth: 10
        at: { x: 15, y: 11, z: 0 }
        dir: +z
      - id: shaft
        diameter: 5.2
        through: true
        at: { x: 15, y: 0, z: 11 }
        dir: +y

  - id: shaft
    kind: dowel
    diameter: 5
    length: 50

  - id: washer
    kind: ring
    outer: 16
    inner: 5.5
    thickness: 3

  - id: hub
    kind: disk
    diameter: 28
    thickness: 10
    holes:
      - id: bore
        diameter: 5.2
        through: true
        at: { x: 0, y: 0, z: 0 }
        dir: +z
      - id: vane-0
        diameter: 3
        depth: 8
        at: { x: 14, y: 0, z: 0 }
        dir: -x
      - id: vane-1
        diameter: 3
        depth: 8
        at: { x: 0, y: 14, z: 0 }
        dir: -y
      - id: vane-2
        diameter: 3
        depth: 8
        at: { x: -14, y: 0, z: 0 }
        dir: +x
      - id: vane-3
        diameter: 3
        depth: 8
        at: { x: 0, y: -14, z: 0 }
        dir: +y

  - id: vane-a
    kind: box
    size: { x: 55, y: 20, z: 3 }
    holes:
      - id: peg
        diameter: 3
        through: true
        at: { x: 6, y: 10, z: 0 }
        dir: +z
  - id: vane-b
    kind: box
    size: { x: 55, y: 20, z: 3 }
    holes:
      - id: peg
        diameter: 3
        through: true
        at: { x: 6, y: 10, z: 0 }
        dir: +z
  - id: vane-c
    kind: box
    size: { x: 55, y: 20, z: 3 }
    holes:
      - id: peg
        diameter: 3
        through: true
        at: { x: 6, y: 10, z: 0 }
        dir: +z
  - id: vane-d
    kind: box
    size: { x: 55, y: 20, z: 3 }
    holes:
      - id: peg
        diameter: 3
        through: true
        at: { x: 6, y: 10, z: 0 }
        dir: +z

  - id: peg-a
    kind: dowel
    diameter: 3
    length: 16
  - id: peg-b
    kind: dowel
    diameter: 3
    length: 16
  - id: peg-c
    kind: dowel
    diameter: 3
    length: 16
  - id: peg-d
    kind: dowel
    diameter: 3
    length: 16

assembly:
  - part: base
    at: { x: 0, y: 0, z: 0 }
  - part: mast
    at: { x: 40, y: 40, z: 12 }
  - part: head
    at: { x: 25, y: 29, z: 152 }
  - part: shaft
    at: { x: 40, y: 14, z: 163 }
    rot: { x: -90, y: 0, z: 0 }
  - part: washer
    at: { x: 40, y: 52.5, z: 163 }
    rot: { x: -90, y: 0, z: 0 }
  - part: hub
    at: { x: 40, y: 59, z: 163 }
    rot: { x: -90, y: 0, z: 0 }
  - part: vane-a
    at: { x: 48, y: 57.5, z: 153 }
    rot: { x: -90, y: 0, z: 0 }
  - part: vane-b
    at: { x: 30, y: 57.5, z: 157 }
    rot: { x: -90, y: 0, z: 90 }
  - part: vane-c
    at: { x: 32, y: 57.5, z: 173 }
    rot: { x: -90, y: 0, z: 180 }
  - part: vane-d
    at: { x: 50, y: 57.5, z: 169 }
    rot: { x: -90, y: 0, z: -90 }
  - part: peg-a
    at: { x: 54, y: 59, z: 163 }
    rot: { x: 0, y: -90, z: 0 }
  - part: peg-b
    at: { x: 40, y: 59, z: 149 }
    rot: { x: 90, y: 0, z: 0 }
  - part: peg-c
    at: { x: 26, y: 59, z: 163 }
    rot: { x: 0, y: 90, z: 0 }
  - part: peg-d
    at: { x: 40, y: 59, z: 177 }
    rot: { x: -90, y: 0, z: 0 }

steps:
  - id: drill-base
    title: Drill the base
    body: Mark the center of the 80mm base. Drill an 8mm hole, 8mm deep. Keep the bit straight.
    show: [base]
    highlight: [base.mast-socket]
    join:
      - from: mast
        into: base.mast-socket

  - id: glue-mast
    title: Glue the mast
    body: Put a little glue in the hole. Push the 8mm mast in until it sits square. Let it set.
    show: [base, mast]

  - id: drill-head
    title: Drill the head
    body: Drill an 8mm pocket 10mm deep in the bottom of the head. Then drill a 5.2mm hole all the way through the sides for the shaft.
    show: [head]
    highlight: [head.mast-pocket, head.shaft]

  - id: seat-head
    title: Seat the head
    body: Press the head onto the top of the mast. The shaft hole should run left to right.
    show: [base, mast, head]
    join:
      - from: mast
        into: head.mast-pocket

  - id: cut-vanes
    title: Cut the vanes
    body: Cut four thin blades, 55 by 20mm. Drill a 3mm hole near one end of each.
    show: [vane-a]
    highlight: [vane-a.peg]

  - id: drill-hub
    title: Drill the hub
    body: Drill a 5.2mm hole through the hub center so it can spin on the shaft. Drill four 3mm holes around the rim for the vanes.
    show: [hub]
    highlight: [hub.bore]

  - id: peg-vanes
    title: Peg the vanes
    body: Glue a 3mm peg through each vane and into the hub. Keep the blades even, like a plus sign.
    show: [hub, vane-a, vane-b, vane-c, vane-d, peg-a, peg-b, peg-c, peg-d]
    join:
      - from: peg-a
        into: hub.vane-0
      - from: peg-a
        into: vane-a.peg
      - from: peg-b
        into: hub.vane-1
      - from: peg-b
        into: vane-b.peg
      - from: peg-c
        into: hub.vane-2
      - from: peg-c
        into: vane-c.peg
      - from: peg-d
        into: hub.vane-3
      - from: peg-d
        into: vane-d.peg

  - id: fit-shaft
    title: Fit the shaft
    body: Slide the 5mm shaft through the head, then the washer, then the hub. The vanes should clear the mast.
    show: [head, shaft, washer, hub, vane-a, vane-b, vane-c, vane-d]
    join:
      - from: shaft
        into: head.shaft
      - from: shaft
        into: hub.bore

  - id: spin-check
    title: Check the spin
    body: Blow on the vanes. The hub should turn freely. Sand the shaft hole a little if it binds.
    show: [base, mast, head, shaft, washer, hub, vane-a, vane-b, vane-c, vane-d, peg-a, peg-b, peg-c, peg-d]
