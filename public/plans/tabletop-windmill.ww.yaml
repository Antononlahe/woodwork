format: woodwork/v0
id: tabletop-windmill
title: Tabletop windmill
summary: A small windmill that actually spins.
difficulty: easy
time_minutes: 50
finished_size: { x: 160, y: 90, z: 210 }
iso_from: { x: 1, y: 1, z: 0.82 }

parts:
  - id: base
    kind: box
    paint: "#5f9a4a"
    size: { x: 80, y: 80, z: 12 }
    holes:
      - id: mast-socket
        diameter: 8
        depth: 8
        at: { x: 40, y: 40, z: 12 }
        dir: -z

  - id: mast
    kind: dowel
    paint: "#e9dfc6"
    diameter: 8
    length: 140

  - id: head
    kind: box
    paint: "#d6452f"
    size: { x: 32, y: 24, z: 28 }
    holes:
      - id: mast-pocket
        diameter: 8
        depth: 10
        at: { x: 16, y: 12, z: 0 }
        dir: +z
      - id: shaft
        diameter: 8
        through: true
        at: { x: 16, y: 0, z: 18 }
        dir: +y

  - id: shaft
    kind: dowel
    diameter: 8
    length: 56

  - id: hub
    kind: disk
    paint: "#f2bd2b"
    diameter: 32
    thickness: 12
    holes:
      - id: bore
        diameter: 8
        through: true
        at: { x: 0, y: 0, z: 0 }
        dir: +z

  - id: nose
    kind: disk
    paint: "#f2bd2b"
    diameter: 18
    thickness: 12
    holes:
      - id: bore
        diameter: 8
        through: true
        at: { x: 0, y: 0, z: 0 }
        dir: +z

  - id: vane-a
    kind: box
    paint: "#2f6bb5"
    size: { x: 55, y: 4, z: 16 }
  - id: vane-b
    kind: box
    paint: "#f6f1e4"
    size: { x: 16, y: 4, z: 55 }
  - id: vane-c
    kind: box
    paint: "#2f6bb5"
    size: { x: 55, y: 4, z: 16 }
  - id: vane-d
    kind: box
    paint: "#f6f1e4"
    size: { x: 16, y: 4, z: 55 }

assembly:
  - part: base
    at: { x: 0, y: 0, z: 0 }
  - part: mast
    at: { x: 40, y: 40, z: 4 }
  - part: head
    at: { x: 24, y: 28, z: 134 }
  - part: shaft
    at: { x: 40, y: 2, z: 152 }
    rot: { x: -90, y: 0, z: 0 }
  - part: hub
    at: { x: 40, y: 16, z: 152 }
    rot: { x: -90, y: 0, z: 0 }
  - part: nose
    at: { x: 40, y: 4, z: 152 }
    rot: { x: -90, y: 0, z: 0 }
  - part: vane-a
    at: { x: 32, y: 6, z: 144 }
  - part: vane-b
    at: { x: 32, y: 6, z: 144 }
  - part: vane-c
    at: { x: -7, y: 6, z: 144 }
  - part: vane-d
    at: { x: 32, y: 6, z: 105 }

steps:
  - id: drill-base
    title: Drill the base
    body: Mark the center of the 80mm base. Drill an 8mm hole, 8mm deep. Keep the bit straight.
    show: [base]
    highlight: [base.mast-socket]
    join:
      - from: mast
        into: base.mast-socket

  - id: glue-mast
    title: Glue the mast
    body: Put a little glue in the hole. Push the 8mm mast in until it sits square. Let it set.
    show: [base, mast]

  - id: drill-head
    title: Drill the head
    body: Cut a 32 by 24 by 28mm block. Drill an 8mm pocket 10mm deep in the bottom. Then drill an 8mm hole through the sides, near the top, for the shaft.
    show: [head]
    highlight: [head.mast-pocket, head.shaft]

  - id: seat-head
    title: Seat the head
    body: Press the head onto the top of the mast. The shaft hole should run left to right.
    show: [base, mast, head]
    join:
      - from: mast
        into: head.mast-pocket

  - id: cut-sails
    title: Cut the sails
    body: Cut a 32mm hub and an 18mm nose from 12mm vineer. Drill an 8mm hole through the center of each. Cut four sails from 4mm vineer, 55 by 16mm.
    show: [hub, nose, vane-a]
    highlight: [hub.bore, nose.bore]

  - id: glue-sails
    title: Glue the sails
    body: Glue the four sails on the front of the hub in a plus. They sit on the face that points away from the house, so they can turn.
    show: [hub, vane-a, vane-b, vane-c, vane-d]

  - id: fit-shaft
    title: Fit the shaft
    body: Slide the 8mm shaft through the nose, the hub, then the head. Glue the hub and the nose to the shaft. Sand the head hole until the sails turn. The sails stay in front of the mast.
    show: [base, mast, head, shaft, hub, nose, vane-a, vane-b, vane-c, vane-d]
    join:
      - from: shaft
        into: head.shaft
      - from: shaft
        into: hub.bore
      - from: shaft
        into: nose.bore

  - id: spin-check
    title: Check the spin
    body: You should have a tower on the base, a little head on top, and four sails in front. Blow on the sails — they should turn without hitting the mast or the base. If the hole binds, sand it. Compare it to the finished picture in the corner.
    show: [base, mast, head, shaft, hub, nose, vane-a, vane-b, vane-c, vane-d]

  - id: paint
    title: Paint it (optional)
    body: "Sand every edge soft. Paint the base green for grass, the mast cream and the head red. Paint the sails blue and white, and the hub and nose yellow. Keep paint off the shaft so it still turns. Let each colour dry before the next."
    show: [base, mast, head, shaft, hub, nose, vane-a, vane-b, vane-c, vane-d]
    paint: true
    adult: false
