steps:
  - id: cut-chassis
    title: "Cut the chassis"
    body: "Cut a 150 by 56mm deck from 12mm vineer. Drill two 8mm holes right through the width for the axles, 32mm and 118mm from the back. Drill from both sides so the bit meets in the middle."
    show: [chassis]
    highlight: [chassis.axle-rear, chassis.axle-front]

  - id: cut-wheels
    title: "Cut four wheels"
    body: "Cut four 40mm disks from 12mm vineer with a jigsaw. Sand them round. Drill an 8mm hole through the middle of each."
    show: [wheel-rl]
    highlight: [wheel-rl.bore]

  - id: rear-axle
    title: "Fit the rear axle"
    body: "Slide an 8mm axle through one wheel, the chassis, then the other wheel. Glue each wheel on, leaving a sliver of air so they do not rub the deck. Sand the chassis hole until the axle spins."
    show: [chassis, axle-rear, wheel-rl, wheel-rr]
    join:
      - from: axle-rear
        into: chassis.axle-rear
      - from: axle-rear
        into: wheel-rl.bore
      - from: axle-rear
        into: wheel-rr.bore

  - id: front-axle
    title: "Fit the front axle"
    body: "Same again at the front. Both pairs of wheels should turn freely and the car should sit level."
    show: [chassis, axle-rear, axle-front, wheel-rl, wheel-rr, wheel-fl, wheel-fr]
    join:
      - from: axle-front
        into: chassis.axle-front
      - from: axle-front
        into: wheel-fl.bore
      - from: axle-front
        into: wheel-fr.bore

  - id: cockpit
    title: "Cockpit and driver"
    body: "Cut a 50 by 48 by 14mm block for the cockpit and glue it behind the middle of the deck. Cut a 20mm disk, 16mm thick, for the driver's helmet and glue it on top."
    show: [chassis, axle-rear, axle-front, wheel-rl, wheel-rr, wheel-fl, wheel-fr, tub, helmet]

  - id: hood
    title: "Add the hood"
    body: "Cut a 60 by 44 by 10mm block. Glue it on the deck in front of the cockpit, flush with the cockpit wall."
    show: [chassis, axle-rear, axle-front, wheel-rl, wheel-rr, wheel-fl, wheel-fr, tub, helmet, hood]

  - id: wing
    title: "Build the rear wing"
    body: "Cut two 6 by 6 by 18mm posts and glue them at the back corners. Cut a 22 by 56 by 4mm wing and glue it across the tops of the posts."
    show: [chassis, axle-rear, axle-front, wheel-rl, wheel-rr, wheel-fl, wheel-fr, tub, hood, helmet, hood, post-l, post-r, wing]

  - id: front
    title: "Bumper and lights"
    body: "Glue an 8 by 56 by 8mm bumper on the front edge. Cut two 10mm disks, 4mm thick, for headlights and glue them on the front of the hood."
    show: [chassis, axle-rear, axle-front, wheel-rl, wheel-rr, wheel-fl, wheel-fr, tub, helmet, hood, post-l, post-r, wing, bumper, light-l, light-r]

  - id: details
    title: "Hubcaps and numbers"
    body: "Cut four 18mm disks from 3mm vineer for hubcaps and glue one on each wheel over the axle end. Cut two 16mm disks and glue them on the sides of the cockpit for the race number."
    show: [chassis, tub, hood, helmet, post-l, post-r, wing, bumper, light-l, light-r, number-l, number-r, axle-rear, axle-front, wheel-rl, wheel-rr, cap-rl, cap-rr, wheel-fl, wheel-fr, cap-fl, cap-fr]

  - id: roll
    title: "Test roll"
    body: "Give it a push. All four wheels should turn and the wing should clear the back wheels. If a wheel rubs, sand the gap. Compare it to the finished picture in the corner."
    show: [chassis, tub, hood, helmet, post-l, post-r, wing, bumper, light-l, light-r, number-l, number-r, axle-rear, axle-front, wheel-rl, wheel-rr, cap-rl, cap-rr, wheel-fl, wheel-fr, cap-fl, cap-fr]

  - id: paint
    title: "Paint it (optional)"
    body: "Sand every edge soft. Paint the body red, the wing blue, the wheels black and the helmet yellow. Paint the number white and the hubcaps silver. Keep paint off the axles so the wheels still turn."
    show: [chassis, tub, hood, helmet, post-l, post-r, wing, bumper, light-l, light-r, number-l, number-r, axle-rear, axle-front, wheel-rl, wheel-rr, cap-rl, cap-rr, wheel-fl, wheel-fr, cap-fl, cap-fr]
    paint: true
    adult: false
