<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Step by step 3D woodworking projects for a grown-up and a kid." />
    <meta name="theme-color" content="#c4500c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Bench plans</title>
    <script>
      // Set the look before first paint so Night mode doesn't flash white.
      try {
        var s = JSON.parse(localStorage.getItem("woodwork.settings") || "{}");
        document.documentElement.dataset.theme = s.theme || "auto";
        document.documentElement.dataset.text = s.text || "m";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
